# Default tenant cluster provisioning values.
#
# Consumed by the platform `clusters` ApplicationSet (matrix generator globs
# fleet/spoke-values/tenants/*/crossplane-clusters/values.yaml). Each key here
# becomes a PlatformCluster claim, and Crossplane provisions a spoke EKS cluster
# from it.
#
# Empty by default, so an install provisions the hub only. Spokes are opt-in.
# This matches appmod-blueprints, which ships fleet/members/ empty with an
# `_example` and expects a consumer to declare what they actually want.
#
# It was previously populated with spoke-dev (10.1.0.0/16) and spoke-prod
# (10.2.0.0/16) pinned to `resourcePrefix: peeks`. That made two spokes, and the
# resource prefix of one reference environment, the default for every consumer,
# regardless of what `spokes` said in their config.local.yaml. Note that this file
# is the GitOps source of truth for provisioning: the `spokes` map in
# config.local.yaml drives only the imperative `task spokes:install` path, so the
# two are independent. Declaring a spoke here is what actually creates it.
#
# Spoke provisioning for tenant "default".
#
# oap-dev is declared here, on the Crossplane path, because it is the path whose
# ApplicationSet generator actually produces an Application in this environment: the
# clusters appset globs this file and creates PlatformCluster/oap-dev (verified live).
# The KRO equivalent (clusters-kro, globbing
# tenants/*/kro-clusters/clusters/*.json) generates nothing even with the file
# committed and ArgoCD resolved to the containing commit, and appmod ships no trigger
# json anywhere, so that path appears unexercised upstream. Tracked in #17.
#
# A cluster must be declared on ONE path only. The platform's own spokes:enable-kro
# deletes the crossplane entry for any cluster it moves to kro.
#
# region is intentionally omitted: the ApplicationSet injects global.defaultRegion
# from the hub cluster secret's aws_region annotation, so a spoke runs in the hub's
# region unless overridden.
#
# clusterName is used verbatim as the EKS cluster name. resourcePrefix is functional,
# not cosmetic: the composition builds this spoke's ACK capability policy as
# sts:AssumeRole on arn:aws:iam::<acct>:role/<resourcePrefix>-cluster-mgmt-*, so it
# must match the hub's prefix, and it tags the VPC platform.gitops.io/prefix.
#
# KNOWN BLOCKER: provisioning cannot complete until the platform's platform-cluster
# Composition is fixed for Crossplane v2. Its six Usage bases declare
# protection.crossplane.io/v1beta1 Usage, which is namespaced in v2, with no
# namespace, so the composite fails with "cannot get existing composed resources:
# ... an empty namespace may not be set when a resource name is provided" and stops
# after ~7 of 35 resources, before the VPC or cluster exist. ClusterUsage is the
# correct scope. See #17.
clusters:
  oap-dev:
    clusterName: oap-dev
    # 10.0.0.0/16 is the hub; 10.2.0.0/16 is an unrelated CDK VPC in this account.
    vpcCidr: "10.1.0.0/16"
    kubernetesVersion: "1.35"
    autoMode: true
    resourcePrefix: peeks
