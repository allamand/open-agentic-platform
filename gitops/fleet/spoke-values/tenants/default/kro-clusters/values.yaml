# KRO spoke provisioning values, tenant "default".
#
# The clusters-kro ApplicationSet globs
# tenants/<tenant>/kro-clusters/clusters/*.json to decide WHICH spokes exist, and
# reads the matching entry here for HOW to build each one. A cluster needs both, plus
# a fleet member under fleet/members/<name>/ so ArgoCD gets a cluster secret.
#
# Provisioning is on the kro path rather than crossplane because the crossplane
# platform-cluster Composition cannot compose on Crossplane v2: its six Usage bases
# declare protection.crossplane.io/v1beta1 Usage, which is namespaced in v2, with no
# namespace, so Crossplane fails with "an empty namespace may not be set when a
# resource name is provided" and aborts before creating the VPC or the cluster.
# Tracked in #17.
clusters:
  oap-dev:
    clusterName: oap-dev
    tenant: default
    # Selects overlays/environments/dev, where agent_platform is enabled.
    environment: dev
    # Load-bearing, not cosmetic. An empty provider label makes the addon registry
    # route this spoke to the crossplane pod-identity chart (its selector is
    # provider NotIn [kro-ack], which an empty value matches), and that chart then
    # 409-conflicts with the pod-identity associations the EksCluster RGD already
    # created.
    provider: "kro-ack"
    region: us-west-2
    k8sVersion: "1.35"
    # Quoted: the RGD expects strings, and an unquoted account id is parsed as a
    # number and loses its leading digits' significance in templating.
    accountId: "929819487611"
    managementAccountId: "929819487611"
    # Must match the hub's prefix so the spoke can assume the hub's
    # <prefix>-cluster-mgmt-* roles.
    resourcePrefix: peeks
    # 10.0.0.0/16 is the hub and 10.2.0.0/16 is an unrelated CDK VPC in this account.
    cidr:
      vpcCidr: "10.1.0.0/16"
      publicSubnet1Cidr: "10.1.1.0/24"
      publicSubnet2Cidr: "10.1.2.0/24"
      privateSubnet1Cidr: "10.1.11.0/24"
      privateSubnet2Cidr: "10.1.12.0/24"
